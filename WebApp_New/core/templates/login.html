<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Management System</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>School Management System</h1>
            
            {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                        <li class="{{ message.tags }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
            
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            
            <div style="margin-top: 20px; text-align: center; padding-top: 20px; border-top: 1px solid #ddd;">
                <p style="color: #666; margin-bottom: 15px;">Don't have an account? Sign up as:</p>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <a href="{% url 'signup_student' %}" style="color: #667eea; text-decoration: none; padding: 8px 12px; border: 1px solid #667eea; border-radius: 4px; font-size: 14px;">Student</a>
                    <a href="{% url 'signup_teacher' %}" style="color: #667eea; text-decoration: none; padding: 8px 12px; border: 1px solid #667eea; border-radius: 4px; font-size: 14px;">Teacher</a>
                    <a href="{% url 'signup_librarian' %}" style="color: #667eea; text-decoration: none; padding: 8px 12px; border: 1px solid #667eea; border-radius: 4px; font-size: 14px;">Librarian</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
